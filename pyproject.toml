[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "codeview"
version = "0.1.0"
description = "Local-first, IDE-independent code explorer powered by SCIP indexes"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Alexander Abakah" }]
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn>=0.30.0",
  "jinja2>=3.1.0",
  "protobuf>=5.0.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
docs = ["mkdocs-material>=9.5"]

[project.scripts]
codeview = "codeview.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["codeview*"]

[tool.setuptools.package-data]
codeview = ["frontend/static/*", "frontend/templates/*", "providers/scip/*.py"]

[tool.pytest.ini_options]
testpaths = ["tests"]

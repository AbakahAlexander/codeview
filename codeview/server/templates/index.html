<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>codeview</title>
  <link rel="stylesheet" href="/static/styles.css" />
</head>
<body>
  <div class="bar">
    <strong>codeview</strong>
    <span id="status"></span>
    <input id="filter" type="search" placeholder="search symbols…" />
    <button type="button" id="back">←</button>
    <button type="button" id="forward">→</button>
    <span id="crumbs"></span>
  </div>
  <div class="layout">
    <div class="tree-pane">
      <ul id="tree" class="tree"></ul>
    </div>
    <div class="src-pane">
      <div id="srcMeta" class="src-meta"></div>
      <pre id="src"><code></code></pre>
    </div>
  </div>
  <script src="/static/app.js"></script>
</body>
</html>

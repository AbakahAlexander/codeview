<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>codeview</title>
  <link rel="stylesheet" href="/static/styles.css?v={{ASSET_V}}" />
</head>
<body>
  <div class="bar">
    <strong>codeview</strong>
    <span id="status"></span>
    <input id="filter" type="search" placeholder="search symbols…" />
    <button type="button" id="back">←</button>
    <button type="button" id="forward">→</button>
    <span id="crumbs"></span>
  </div>
  <div class="layout">
    <div class="tree-pane">
      <ul id="tree" class="tree"></ul>
    </div>
    <div class="src-pane">
      <div id="srcMeta" class="src-meta"></div>
      <div id="srcPanels" class="src-panels">
        <section class="src-block" id="srcCallBlock" hidden>
          <div class="src-label" id="srcCallLabel">call site</div>
          <pre class="src" id="srcCall"></pre>
        </section>
        <section class="src-block" id="srcDefBlock">
          <div class="src-label" id="srcDefLabel">definition</div>
          <pre class="src" id="srcDef"></pre>
        </section>
      </div>
    </div>
  </div>
  <script src="/static/app.js?v={{ASSET_V}}"></script>
</body>
</html>
